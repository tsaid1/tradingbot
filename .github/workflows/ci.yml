name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests docs/research/g0_x_probe
  hosted-tests:
    # The hosted reviewer site's tests (tests/test_hosted_*.py): the site's own pinned packages
    # and an embedded Postgres (pgserver: a manylinux wheel, started as the runner's own user).
    # The job above installs none of them, and there these modules skip at collection.
    runs-on: ubuntu-latest
    env:
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' -r hosted/requirements.txt 'pgserver==0.1.4'
      - run: python -m pytest tests/test_hosted_*.py
