[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot-signal-lab"
version = "0.1.0"
description = "Fail-closed, mock-only trading signal interpretation laboratory"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "streamlit>=1.36,<2",
  "openai>=2.0,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
