# Default query list for scripts/ibkr_contract_discovery.py (read-only contract discovery).
# Editable. A symbol IBKR does not know is harmless: it comes back as a NOT_FOUND row (with the
# broker's code and message) and the batch goes on. Research on the exact products is still in
# progress; entries marked UNCONFIRMED are candidates, not verified IBKR listings.
#
# [[contract]] keys (only name and symbol are required): symbol, sec_type (default STK),
#   exchange (SMART), currency (USD), primary_exchange, last_trade_date_or_contract_month
#   (YYYYMM or YYYYMMDD), multiplier, trading_class, local_symbol, strike, right ("C"/"P"),
#   include_expired (false).
# Leaving the contract month empty on a FUT query returns every unexpired month (up to `limit`).
# [[option_chain]] keys: name, symbol, sec_type, exchange, currency, primary_exchange (the
#   underlying, which must resolve to exactly one contract), fut_fop_exchange ("" = all).

schema = "tradingbot.ibkr.contract_discovery_queries/1"
pace_seconds = 1.0      # fixed pause between requests
limit = 50              # contracts kept per query; more -> cancelled and marked truncated
request_timeout = 15.0  # seconds per request

