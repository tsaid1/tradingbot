# Example runtime config (mock mode). Copy to ~/.config/tradingbot/runtime.toml and adjust.
# Relative paths resolve against the directory of this file. Unknown keys refuse to start.

mode = "mock"   # the only accepted value: the simulated broker

[paths]
state_dir = "~/.local/state/tradingbot/mock-runtime"
halt_file = "~/.local/state/tradingbot/HALT"
mapping_file = "instrument_mapping.toml"

[source]
kind = "replay"
file = "../fixtures/runtime/mock_service_posts.jsonl"   # invented posts
compression = 60.0        # one recorded minute per real second; omit for historical replay
lag_seconds = 5.0         # historical replay only: decide at available_at + lag

# Live polling of the publisher's X timeline (needs the subscriber's OAuth token, see RUNTIME.md):
# [source]
# kind = "x_timeline"
# author_id = "<numeric X user id>"
# token_file = "~/.config/tradingbot/g0/tokens.json"
# client_file = "~/.config/tradingbot/g0/client.json"

[service]
cadence_seconds = 5.0
max_backoff_seconds = 300.0
failure_alert_after = 3
stuck_after_seconds = 60
# Alerting only (optional; never sizes or bounds an order). SOURCE_STALLED when the source cursor
# has not advanced for this long inside the window (UTC, Monday to Friday) the publisher posts in.
source_stall_after_seconds = 14400
activity_window_utc = "13:30-20:00"
heartbeat_stale_after_seconds = 120   # the watchdog's limit (default max(120, 10 x cadence))
# An identity lockout clears only through a full reconnect (default true). false also accepts an
# identity read alone from an adapter that cannot reconnect (journaled IDENTITY_REREAD_ONLY).
lockout_clear_requires_full_reconnect = true

# Every size, cap, collar, freshness and timing value below is required: a missing one refuses to
# start, naming it. Nothing that sizes or bounds an order runs on a default.
[policy]                  # illustrative mock limits (tradingbot.models.MockPolicy)
quantity = 2
quantity_per_add = 2
max_price_deviation_pct = "1.0"     # entry/exit price collar around the reference, percent
max_spread_pct = "1.0"
max_notional_usd = "2000"           # per idea: quantity x price x contract multiplier
max_signal_age_seconds = 90         # source freshness
max_quote_age_seconds = 30          # broker quote freshness
max_instrument_exposure_usd = "2000"
max_aggregate_exposure_usd = "10000"

[interpreter]
# lexicon_path = "/path/outside/the/repo/lexicon.json"   # optional private extension
# review_log_path = "/path/outside/the/repo/review.jsonl"   # optional PRIVATE vocabulary review log (docs/RUNTIME.md)

[notify]
channels = ["log", "alerts_file"]   # registered channels (runtime/notify.py); no external one
macos = false                       # true adds the local macOS notification centre
realert_seconds = 3600              # an alert still open is notified again this often
# alerts_file = "..."               # default <state_dir>/alerts.jsonl (the dashboard reads it)

[execution]
expected_account = "SIM-PAPER-0001"   # required: the coordinator refuses any other broker account
max_submit_attempts = 2
settle_seconds = 10                   # after an unknown outcome: "no trace" never concluded sooner
exit_no_trace_lookups = 3             # an exit is resent only after this many no-trace lookups
                                      # over the settle period; an entry or add is never resent
max_intent_age_seconds = 120          # an entry or add older than this is never sent
max_exit_intent_age_seconds = 120     # an older exit is re-priced from a fresh quote, or refused
lookup_horizon_seconds = 21600        # how far back the broker's executions reach (IBKR: the day)
confirm_attempts = 3                  # cancel / resize confirmation reads before an exit
confirm_wait_seconds = 0

[mock]
account = "SIM-PAPER-0001"
quotes = { TLT = { bid = "88.40", ask = "88.42" } }

[operator_confirmation]        # optional; docs/OPERATOR_CONFIRMATION.md
enabled = false               # one-press owner confirmation of interpretation holds; paper only
