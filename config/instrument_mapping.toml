# approved = false
# note = "EXAMPLE: spot levels converted with the observed spot-to-future basis."
# reference = { sec_type = "CMDTY", symbol = "EXSPOT", exchange = "EXAMPLE", currency = "USD" }
# execution = { sec_type = "FUT", symbol = "EXMTL", exchange = "EXAMPLE", currency = "USD", multiplier = "10", min_tick = "0.10" }
