# Source-series-to-broker-contract mapping policy, version 2 (tradingbot.runtime.mapping).
# See docs/MULTI_ASSET_MAPPING.md.
#
# One [[mapping]] entry per source asset family: the asset code the interpreter emits for what the
# publisher named (an option family is "<UNDERLYING>.OPT"). Each entry states the reference series
# the publisher's levels are quoted in, the execution instrument, exactly one price-basis
# treatment, and the owner's approval:
#
#   DIRECT             levels are the execution instrument's own prices
#   BASIS_SHIFT        levels are converted with the basis observed at the decision moment from
#                      simultaneous live reference and execution quotes (capped, recorded)
#   REFERENCE_TRIGGER  the entry is priced from the execution quote; stop and target are held as
#                      broker-side conditions on the reference series
#   UNSUPPORTED        always HOLD (documents why a family is held)
#
# An entry with approved = false never executes (HOLD, MAPPING_NOT_APPROVED). A family with no entry
# is HELD with UNSUPPORTED_INSTRUMENT_MAPPING. An index, spot or futures level is never sent as the
# price of another instrument. The version-1 vocabulary (INDEX_LEVEL, SPOT_LEVEL, FUTURES_LEVEL,
# PROXY) is retired: such relationships are BASIS_SHIFT or REFERENCE_TRIGGER entries, approved per
# family, or UNSUPPORTED. Loading fails closed: an unknown key, a missing required field, an
# inconsistent combination or two entries for one family refuses to start.
#
# Two further rules are owner decisions per family and are OFF unless an approved entry says so
# (see docs/MULTI_ASSET_MAPPING.md, "Entry rule" and "Level contract rule"):
#
#   entry_rule = "EXPLICIT_ENTRY_ONLY"   (default) only explicit execution language sets an entry
#   entry_rule = "REFERENCE_AS_COLLAR"   a current open or add stating exactly one market level
#                                        enters with a LIMIT at the live marketable price, the
#                                        stated level an anchor bounded by [entry_anchor]
#                                        max_adverse_move / max_favourable_move ("2.5" or "0.5%"),
#                                        max_signal_age_seconds, anchor_scope,
#                                        max_quote_age_seconds (each side of the live streaming
#                                        quote; ceiling 5 s) and environment = "PAPER" (its only
#                                        value): all required, no defaults. Paper and simulation
#                                        only; never a funded account; never a market order
#   level_contract_rule = "EXPLICIT_MONTH_ONLY"  (default) a futures level needs a named month
#   level_contract_rule = "FRONT_MONTH"  a DIRECT futures level with no month means the front
#                                        contract of the entry's own list; HOLD in its roll window

version = 2

[[mapping]]
family = "TLT"
basis = "DIRECT"
approved = true
approved_by = "owner"
approved_at = 2026-11-12T00:00:00Z
note = "Publisher levels for TLT are quoted in the ETF's own share price. Current-market entry rule approved by the owner on 2026-11-12: paper and simulation only; does not authorize broker order submission."
reference = { sec_type = "STK", asset_class = "ETF", symbol = "TLT", exchange = "SMART", currency = "USD" }
execution = { sec_type = "STK", asset_class = "ETF", symbol = "TLT", exchange = "SMART", currency = "USD" }
# The only exposure the owner has approved so far: 1 share, at most 150 USD notional, in the US
# regular session. The entry rule is decided on the mapped path, which needs both.
sizing = { units_per_signal = 1, max_units = 1, max_notional = "150" }
session = { policy = "REGULAR_ONLY", timezone = "America/New_York", days = ["MON", "TUE", "WED", "THU", "FRI"], regular = ["09:30-16:00"] }
# Owner's decision of 2026-11-12, TLT only: a current open stating exactly one market level, in a
# post about this one market, enters with a LIMIT at the live ask (long) or bid (short), within
# 0.3% adverse / 0.6% favourable of the stated level, at most 90 s after publication, on a live
# streaming quote whose bid and ask are each at most 3 s old, always with a protective stop.
# Paper and simulation only; does not authorize broker order submission.
entry_rule = "REFERENCE_AS_COLLAR"
entry_anchor = { max_adverse_move = "0.3%", max_favourable_move = "0.6%", max_signal_age_seconds = 90, anchor_scope = "SINGLE_MARKET_POST", max_quote_age_seconds = 3, environment = "PAPER" }

# ------------------------------------------------------------------ templates (not active)
# EXAMPLES ONLY. Every symbol, exchange, multiplier, tick, date, hour and cap below is a placeholder
# to show the shape of an entry, not a contract specification. Replace each value with the broker's
# own contract details (verified against the paper account) before uncommenting, then set
# approved = true with approved_by and approved_at only once the owner has reviewed the entry.
#
# --- an index family quoted in index points, executed in an index future, exits on the index
# [[mapping]]
# family = "SPX"                                   # the interpreter's code for the index
# basis = "REFERENCE_TRIGGER"
# approved = false
# note = "EXAMPLE: index levels; entry priced from the future's quote; stop/target as conditions."
# reference = { sec_type = "IND", symbol = "EXIDX", exchange = "EXAMPLE", currency = "USD" }
# execution = { sec_type = "FUT", symbol = "EXFUT", exchange = "EXAMPLE", currency = "USD", multiplier = "5", min_tick = "0.25", size_increment = 1 }
# contract_selection = { rule = "EXPLICIT_OR_NEAREST", min_business_days_to_roll = 6 }
# contracts = [ { month = "202612", roll_date = 2026-12-10 }, { month = "202703", roll_date = 2027-03-11 } ]
# sizing = { units_per_signal = 1, max_units = 2, max_notional = "50000" }
# session = { policy = "REGULAR_ONLY", timezone = "America/New_York", days = ["MON", "TUE", "WED", "THU", "FRI"], regular = ["09:30-16:00"] }
# roll = { business_days_before = 3, action = "FLATTEN" }
# reference_trigger = { released_order_type = "MKT", reference_hours = ["09:30-16:00"], require_backstop = true }
# basis_shift = { max_abs_basis = "40", max_age_seconds = 5, scale_ratio = "1" }   # prices the backstop stop
# entry_rule = "REFERENCE_AS_COLLAR"               # owner decision: a stated index level anchors the entry
# entry_anchor = { max_adverse_move = "10", max_favourable_move = "25", max_signal_age_seconds = 60, anchor_scope = "SENTENCE_STRICT", max_quote_age_seconds = 3, environment = "PAPER" }   # index points
#
# --- an energy future quoted in its own contract month's price, executed in a micro contract
# --- on the same underlying that trades at that same price (same_series asserts this)
# [[mapping]]
# family = "WTI"
# basis = "DIRECT"
# approved = false
# note = "EXAMPLE: the publisher quotes the named contract month itself."
# same_series = true
# same_series_reason = "EXAMPLE: the micro trades at the standard contract month's own price"
# equivalent_roots = ["EXOIL", "EXMOIL"]   # same_series joins two futures of one underlying only
# reference = { sec_type = "FUT", symbol = "EXOIL", exchange = "EXAMPLE", currency = "USD" }
# execution = { sec_type = "FUT", symbol = "EXMOIL", exchange = "EXAMPLE", currency = "USD", multiplier = "100", min_tick = "0.01" }
# contract_selection = { rule = "EXPLICIT_ONLY", min_business_days_to_roll = 6 }
# contracts = [ { month = "202612", roll_date = 2026-11-16 }, { month = "202701", roll_date = 2026-12-15 } ]
# sizing = { units_per_signal = 1, max_units = 2, max_notional = "20000" }
# session = { policy = "EXTENDED", timezone = "America/New_York", days = ["MON", "TUE", "WED", "THU", "FRI"], regular = ["09:00-14:30"], extended = ["00:00-09:00", "14:30-17:00", "18:00-24:00"] }
# roll = { business_days_before = 3, action = "FLATTEN", holidays = [2026-11-26] }
# level_contract_rule = "FRONT_MONTH"              # owner decision: a level with no month is the front contract's
# entry_rule = "REFERENCE_AS_COLLAR"               # owner decision: a stated level anchors the entry
# entry_anchor = { max_adverse_move = "0.5%", max_favourable_move = "1.5%", max_signal_age_seconds = 60, anchor_scope = "SENTENCE_STRICT", max_quote_age_seconds = 3, environment = "PAPER" }
