<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{% block title %}Adjudication{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
{% if demo %}<p class="demo-band" role="note">Demonstration data: every post, price and reading on this site is invented.</p>{% endif %}
<header class="site">
  <a class="brand" href="/">Trading signal adjudication</a>
  {% if who %}
  <nav aria-label="Site">
    <a href="/">Workspace</a>
    <a href="/guide">Reviewer guide</a>
    <a href="/fields">Field reference</a>
    <form method="post" action="/sign-out">
      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <button type="submit" class="quiet">Sign out</button>
    </form>
  </nav>
  {% endif %}
</header>
<main id="main"{% block main_class %}{% endblock %}>
{% block main %}{% endblock %}
</main>
</body>
</html>
